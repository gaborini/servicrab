[workspace]
members = [
    "crates/servicrab-cli",
    "crates/servicrab-core",
    "crates/servicrab-protocol",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["servicrab contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gaborini/servicrab"
homepage = "https://github.com/gaborini/servicrab"
keywords = ["process", "supervisor", "daemon", "cli", "devtools"]
categories = ["command-line-utilities", "development-tools"]
# Minimum supported Rust version.  Verified by a dedicated CI job — do not
# raise it without checking the dependency tree, and do not lower it without
# proving the lockfile still builds.
rust-version = "1.85"

# Release builds ship to other machines: strip them, and let the optimiser see
# the whole crate graph.  The extra build time only lands on `--release`.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"

# Duration parsing
humantime = "2"

# Unix process/signal APIs (used only by the Unix runtime module).  `fs` is
# there for the `flock` that gives one project one daemon.
nix = { version = "0.31", features = ["signal", "process", "fs", "socket", "user"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Internal crates
servicrab-core = { path = "crates/servicrab-core", version = "1.0.0" }
servicrab-protocol = { path = "crates/servicrab-protocol", version = "1.0.0" }
