name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless, so
# it is cancelled rather than left to report on code nobody has any more.  Runs
# on `main` are left alone: those are the ones a release is cut from, and their
# results are what the branch's history is judged by.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite runs in about a minute; anything close to this means a test
    # deadlocked, and a hung job should fail fast instead of burning an hour.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # --locked everywhere: without it cargo is free to pick up a newer
      # transitive dependency, and CI would stop testing what Cargo.lock ships.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  msrv:
    name: msrv (minimum supported Rust version)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # An MSRV nobody checks is a guess.  Read it from the manifest so the
      # job cannot drift away from what the crates promise.
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: |
          set -euo pipefail
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Workspace MSRV: ${version}"

      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # --locked matters: the promise is about the versions we ship in
      # Cargo.lock, not about whatever resolves today.
      - name: Check the workspace on the MSRV
        run: cargo check --workspace --all-features --all-targets --locked

  windows:
    name: windows (stubs compile)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Windows is a non-goal: supervision is Unix-only and the runtime reports
      # UnsupportedPlatform there.  What this job protects is the `cfg(not(unix))`
      # stubs, which nobody compiles locally and which could rot unnoticed.
      # Compiling is the whole promise — lints are not gated on a platform we do
      # not ship, and the stubs legitimately leave Unix-only helpers unused.
      - name: Check that the non-Unix build still compiles
        run: cargo check --workspace --all-features --all-targets --locked

  package:
    name: package (crates.io dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Catches missing manifest metadata and files left out of the package
      # long before a release tag depends on them.
      - name: Package every crate
        run: cargo package --workspace --locked
